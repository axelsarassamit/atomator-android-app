name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for tag annotation extraction

      # ── Resolve version & release info ─────────────────────────────────────
      - name: Get version and release info
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            echo "version=$VER"               >> $GITHUB_OUTPUT
            echo "apk_name=atomator-$VER.apk" >> $GITHUB_OUTPUT
            echo "is_release=true"            >> $GITHUB_OUTPUT
          else
            SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            echo "version=dev-$SHA"                 >> $GITHUB_OUTPUT
            echo "apk_name=atomator-dev-$SHA.apk"   >> $GITHUB_OUTPUT
            echo "is_release=false"                 >> $GITHUB_OUTPUT
          fi

      # ── Parse tag annotation for release title + body ──────────────────────
      # Tag annotation convention:
      #   Line 1  : short description  →  appended to release title
      #   Line 2  : blank
      #   Line 3+ : markdown body (### headings, * bullets, **bold**)
      #
      # Tags must be created with:
      #   git -c core.commentChar=% tag -a vX.Y.Z -F message.txt
      # so that lines starting with '#' (markdown headings) are preserved.
      - name: Extract release notes from tag annotation
        if: startsWith(github.ref, 'refs/tags/')
        id: relnotes
        run: |
          TAG_FULL=$(git -c core.commentChar=% tag -l --format='%(contents)' "${{ github.ref_name }}")
          SHORT_DESC=$(printf '%s' "$TAG_FULL" | head -1)
          echo "short_desc=$SHORT_DESC" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<ENDOFBODY'
            printf '%s' "$TAG_FULL" | tail -n +3
            echo ''
            echo 'ENDOFBODY'
          } >> "$GITHUB_OUTPUT"

      # ── Toolchain ──────────────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      # ── Project scaffold ───────────────────────────────────────────────────
      - name: Backup source files
        run: |
          cp -r lib               lib_bak
          cp -r assets            assets_bak
          cp    pubspec.yaml      pubspec_bak.yaml
          cp -r scripts           scripts_bak
          cp -r android_manifest  android_manifest_bak

      - name: Scaffold clean Flutter project
        run: |
          rm -rf android ios web linux macos windows test
          flutter create --project-name atomator_app .

      - name: Restore source files
        run: |
          rm -rf lib assets pubspec.yaml scripts android_manifest
          mv lib_bak              lib
          mv assets_bak           assets
          mv pubspec_bak.yaml     pubspec.yaml
          mv scripts_bak          scripts
          mv android_manifest_bak android_manifest

      # ── Android config & signing ───────────────────────────────────────────
      - name: Patch Android config
        run: python3 scripts/patch_android.py

      - name: Setup release signing
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/setup_signing.py

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.apk_name }}"

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ steps.version.outputs.apk_name }}
          retention-days: 30

      # ── GitHub Release (tag pushes only) ───────────────────────────────────
      # Title format:  Atomator Mobile {version} — {short description}
      # Body sourced from the annotated tag message (after the first blank line)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Atomator Mobile ${{ steps.version.outputs.version }} — ${{ steps.relnotes.outputs.short_desc }}"
          body: ${{ steps.relnotes.outputs.body }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
